<!doctype html>
<!-- Source for static/og.png (1200×630 social preview). Regenerate with: node scripts/og/render.cjs -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
		/>
		<style>
			* {
				margin: 0;
				box-sizing: border-box;
			}
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: #070709;
				color: #e7e9ee;
				font-family: Inter, system-ui, sans-serif;
				position: relative;
			}
			.grid {
				position: absolute;
				inset: 0;
				background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
				background-size: 24px 24px;
				mask-image: radial-gradient(ellipse 80% 90% at 70% 50%, #000 30%, transparent 85%);
			}
			.glow {
				position: absolute;
				width: 560px;
				height: 560px;
				right: -80px;
				top: 40px;
				background: radial-gradient(circle, rgba(0, 240, 255, 0.14), transparent 65%);
			}
			.mono {
				font-family: 'JetBrains Mono', ui-monospace, monospace;
			}
			.content {
				position: absolute;
				left: 72px;
				top: 64px;
				bottom: 64px;
				width: 640px;
				display: flex;
				flex-direction: column;
			}
			.pill {
				align-self: flex-start;
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 8px 16px;
				border-radius: 999px;
				border: 1px solid rgba(16, 185, 129, 0.3);
				background: rgba(16, 185, 129, 0.08);
				color: #6ee7b7;
				font-size: 16px;
			}
			.dot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				background: #10b981;
				box-shadow: 0 0 10px #10b981;
			}
			.eyebrow {
				margin-top: 44px;
				font-size: 15px;
				letter-spacing: 0.18em;
				color: #8b909c;
			}
			.eyebrow b {
				color: #00f0ff;
				font-weight: 400;
			}
			h1 {
				margin-top: 18px;
				font-size: 76px;
				line-height: 1;
				font-weight: 800;
				letter-spacing: -0.035em;
				color: #fff;
			}
			.role {
				margin-top: 22px;
				font-size: 28px;
				line-height: 1.3;
				font-weight: 500;
				background: linear-gradient(90deg, #e7e9ee, #00f0ff);
				-webkit-background-clip: text;
				color: transparent;
			}
			.foot {
				margin-top: auto;
				display: flex;
				gap: 28px;
				font-size: 17px;
				color: #8b909c;
			}
			.foot .domain {
				color: #fff;
			}
			.foot .domain i {
				color: #00f0ff;
				font-style: normal;
			}
			svg {
				position: absolute;
				right: 56px;
				top: 95px;
			}
		</style>
	</head>
	<body>
		<div class="grid"></div>
		<div class="glow"></div>

		<div class="content">
			<div class="pill mono"><span class="dot"></span>Open to remote &amp; relocation</div>
			<p class="eyebrow mono"><b>[</b> BACKEND · CLOUD · DISTRIBUTED SYSTEMS <b>]</b></p>
			<h1>Nanda Wijaya<br />Putra</h1>
			<p class="role">Software Engineer — Payments,<br />Distributed Systems &amp; Observability</p>
			<div class="foot mono">
				<span class="domain">nanwp<i>.</i>com</span>
				<span>Go · gRPC · NATS · Kafka · AWS · K8s</span>
			</div>
		</div>
